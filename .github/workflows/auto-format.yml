name: Auto Format with Black and Isort

on:
  push:
    branches:
      - 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install black and isort
        run: |
          python -m pip install --upgrade pip
          pip install black isort

      - name: Run isort
        run: |
          isort .

      - name: Run black
        run: |
          black .

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes_detected=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes_detected == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          BRANCH_NAME="auto-format-${{ github.sha }}"
          git checkout -b $BRANCH_NAME
          git add .
          git commit -m "chore: auto-format with black and isort"
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        if: steps.git-check.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-format-${{ github.sha }}
          title: "chore: auto-format code with black and isort"
          body: |
            This PR was automatically created to apply code formatting changes using black and isort.
            
            Changes include:
            - Code formatting with black
            - Import sorting with isort
          commit-message: "chore: auto-format with black and isort"
          base: ${{ github.event.repository.default_branch }}
